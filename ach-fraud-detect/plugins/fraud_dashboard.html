<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ACH Fraud Detection Dashboard</title>
<style>
  :root {
    --bg: #0f172a;
    --panel: #1e293b;
    --panel-2: #273449;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --accent: #38bdf8;
    --danger: #ef4444;
    --warn: #f59e0b;
    --ok: #22c55e;
    --border: #334155;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    padding: 20px 32px;
    background: linear-gradient(90deg, #0f172a 0%, #1e293b 100%);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  header h1 { margin: 0; font-size: 20px; font-weight: 600; }
  header .sub { font-size: 12px; color: var(--muted); margin-top: 4px; }
  main { padding: 24px 32px; max-width: 1400px; margin: 0 auto; }
  .kpis {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 16px;
    margin-bottom: 24px;
  }
  .kpi {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 16px;
  }
  .kpi .label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .kpi .value { font-size: 28px; font-weight: 600; margin-top: 6px; }
  .kpi.danger .value { color: var(--danger); }
  .kpi.warn .value { color: var(--warn); }
  .kpi.ok .value { color: var(--ok); }

  .grid {
    display: grid;
    grid-template-columns: 1.2fr 1fr;
    gap: 24px;
  }
  @media (max-width: 1000px) { .grid { grid-template-columns: 1fr; } }

  .panel {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }
  .panel h2 {
    margin: 0;
    padding: 14px 16px;
    font-size: 14px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    color: var(--muted);
    border-bottom: 1px solid var(--border);
    background: var(--panel-2);
  }
  .panel textarea {
    background: var(--bg);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font: inherit;
  }
  th.sortable {
    cursor: pointer;
    user-select: none;
  }
  th.sortable:hover {
    background: rgba(56, 189, 248, 0.1);
  }
  .sort-icon {
    display: inline-block;
    margin-left: 6px;
    font-size: 10px;
    color: var(--muted);
    vertical-align: middle;
  }
  th.sortable.active .sort-icon {
    color: var(--accent);
  }
  .panel .body { overflow-y: auto; max-height: 520px; }

  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 10px 12px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; font-size: 11px; text-transform: uppercase; letter-spacing: 0.05em; }
  tbody tr:hover { background: rgba(56, 189, 248, 0.06); cursor: pointer; }
  tbody tr.selected { background: rgba(56, 189, 248, 0.15); }
  .risk {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 999px;
    font-weight: 600;
    font-size: 11px;
  }
  .risk.low { background: rgba(34, 197, 94, 0.15); color: var(--ok); }
  .risk.med { background: rgba(245, 158, 11, 0.15); color: var(--warn); }
  .risk.high { background: rgba(239, 68, 68, 0.15); color: var(--danger); }

  .decision-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 4px;
    font-size: 11px;
    font-weight: 600;
  }
  .decision-badge.legit { background: rgba(34, 197, 94, 0.15); color: var(--ok); }
  .decision-badge.fraud { background: rgba(239, 68, 68, 0.15); color: var(--danger); }
  .decision-badge.invest { background: rgba(245, 158, 11, 0.15); color: var(--warn); }
  .decision-badge.pending { background: rgba(148, 163, 184, 0.15); color: var(--muted); }

  #details .body { padding: 16px; }
  #details .empty { color: var(--muted); font-style: italic; padding: 40px 16px; text-align: center; }
  .detail-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px dashed var(--border); font-size: 13px; }
  .detail-row:last-child { border-bottom: none; }
  .detail-row .k { color: var(--muted); }
  .detail-row .v { font-weight: 500; }

  .reasons { margin-top: 12px; }
  .reasons h3 { font-size: 12px; text-transform: uppercase; color: var(--muted); margin: 12px 0 6px; }
  .reasons ul { margin: 0; padding-left: 20px; }
  .reasons li { padding: 3px 0; }
  .reasons .none { color: var(--muted); font-style: italic; }

  .actions { margin-top: 20px; padding-top: 16px; border-top: 1px solid var(--border); }
  .actions h3 { font-size: 12px; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
  .notes-box { margin-top: 14px; }
  .notes-box label {
    display: block;
    font-size: 12px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .notes-box textarea {
    width: 100%;
    min-height: 90px;
    resize: vertical;
  }
  .btn {
    display: inline-block;
    padding: 8px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--panel-2);
    color: var(--text);
    font-weight: 500;
    font-size: 13px;
    cursor: pointer;
    margin-right: 6px;
    margin-bottom: 6px;
    transition: all 0.15s;
  }
  .btn:hover { transform: translateY(-1px); }
  .btn.legit { border-color: var(--ok); color: var(--ok); }
  .btn.fraud { border-color: var(--danger); color: var(--danger); }
  .btn.invest { border-color: var(--warn); color: var(--warn); }
  .btn.legit:hover { background: rgba(34, 197, 94, 0.15); }
  .btn.fraud:hover { background: rgba(239, 68, 68, 0.15); }
  .btn.invest:hover { background: rgba(245, 158, 11, 0.15); }

  .live-dot { display: inline-block; width: 8px; height: 8px; background: var(--ok); border-radius: 50%; margin-right: 6px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }

  .toast {
    position: fixed;
    bottom: 24px;
    right: 24px;
    padding: 12px 18px;
    background: var(--panel-2);
    border: 1px solid var(--ok);
    border-radius: 8px;
    color: var(--text);
    font-size: 13px;
    opacity: 0;
    transition: opacity 0.3s;
    pointer-events: none;
  }
  .toast.show { opacity: 1; }
  .toast.error { border-color: var(--danger); }
</style>
</head>
<body>
<header>
  <div>
    <h1>ACH Fraud Detection</h1>
    <div class="sub"><span class="live-dot"></span>Live ACH payment monitoring - refreshes every 5s</div>
  </div>
  <div class="sub" id="last-update">-</div>
</header>

<main>
  <section class="kpis" id="kpis"></section>

  <section class="grid">
    <div class="panel">
      <h2>Flagged ACH payments</h2>
      <div class="body">
        <table id="flagged-table">
          <thead><tr>
            <th class="sortable" data-sort="time_desc">Time<span class="sort-icon">▼</span></th>
            <th class="sortable" data-sort="amount_desc">Amount<span class="sort-icon">◆</span></th>
            <th>Receiver</th>
            <th>States</th>
            <th class="sortable" data-sort="risk_desc">Risk<span class="sort-icon">◆</span></th>
            <th>Decision</th>
          </tr></thead>
          <tbody></tbody>
        </table>
      </div>
    </div>

    <div class="panel" id="details">
      <h2>Transaction details</h2>
      <div class="body">
        <div class="empty">Click a flagged payment to view details.</div>
      </div>
    </div>
  </section>

  <section class="panel" style="margin-top: 24px;">
    <h2>Recent ACH payments</h2>
    <div class="body">
      <table id="recent-table">
        <thead><tr>
          <th>Time</th><th>Amount</th><th>Receiver</th><th>States</th><th>Channel</th><th>Risk</th><th>Decision</th>
        </tr></thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</main>

<div class="toast" id="toast"></div>

<script>
const API = "/fraud-dashboard";
const RISK_THRESHOLD = 0.55;
let selectedId = null;
let flaggedRows = [];
let flaggedSort = "time_desc";
function riskClass(score) {
  if (score >= 0.75) return "high";
  if (score >= 0.5) return "med";
  return "low";
}
function decisionBadge(d, score) {
  if (!d && Number(score) < RISK_THRESHOLD) return '<span class="decision-badge legit">Not flagged</span>';
  if (!d) return '<span class="decision-badge pending">Pending review</span>';
  if (d === "Legitimate") return '<span class="decision-badge legit">Legitimate</span>';
  if (d === "Fraud") return '<span class="decision-badge fraud">Fraud</span>';
  return '<span class="decision-badge invest">Investigating</span>';
}
function fmtTime(iso) {
  try { return new Date(iso).toLocaleString(); } catch { return iso; }
}
function fmtAmt(a) { return "$" + Number(a).toFixed(2); }

function showToast(msg, isError = false) {
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.toggle("error", isError);
  t.classList.add("show");
  setTimeout(() => t.classList.remove("show"), 2500);
}

async function refreshKpis() {
  const r = await fetch(API + "/api/summary");
  const s = await r.json();
  const kpis = [
    { label: "Total ACH payments", value: s.total_tx ?? 0 },
    { label: "Payments under review", value: s.suspicious_tx ?? 0, cls: "warn" },
    { label: "Avg risk score", value: (s.avg_score ?? 0).toFixed(3) },
    { label: "Avg flagged risk score", value: (s.avg_flagged_score ?? 0).toFixed(3), cls: "danger" },
    { label: "Max risk score", value: (s.max_score ?? 0).toFixed(3), cls: "danger" },
    { label: "Confirmed fraud", value: s.confirmed_fraud ?? 0, cls: "danger" },
    { label: "Confirmed legit", value: s.confirmed_legit ?? 0, cls: "ok" },
    { label: "Under investigation", value: s.needs_investigation ?? 0, cls: "warn" },
  ];
  const html = kpis.map(k => `
    <div class="kpi ${k.cls || ''}">
      <div class="label">${k.label}</div>
      <div class="value">${k.value}</div>
    </div>`).join("");
  document.getElementById("kpis").innerHTML = html;
}

function sortFlaggedRows(rows) {
  const copy = [...rows];
  switch (flaggedSort) {
    case "risk_asc":
      copy.sort((a, b) => Number(a.fraud_score) - Number(b.fraud_score));
      break;
    case "time_desc":
      copy.sort((a, b) => new Date(b.ts) - new Date(a.ts));
      break;
    case "amount_desc":
      copy.sort((a, b) => Number(b.amount) - Number(a.amount));
      break;
    case "risk_desc":
    default:
      copy.sort((a, b) => Number(b.fraud_score) - Number(a.fraud_score));
      break;
  }
  return copy;
}

async function refreshFlagged() {
  const r = await fetch(API + "/api/flagged?limit=50");
  flaggedRows = await r.json();
  const tbody = document.querySelector("#flagged-table tbody");
  const rows = sortFlaggedRows(flaggedRows);
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="6" style="text-align:center; color: var(--muted); padding: 32px;">No flagged ACH payments yet.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(t => `
    <tr data-id="${t.id}" class="${t.id === selectedId ? 'selected' : ''}">
      <td>${fmtTime(t.ts)}</td>
      <td>${fmtAmt(t.amount)}</td>
      <td>${t.receiver_name}</td>
      <td>${t.originator_state} -> ${t.receiver_state}</td>
      <td><span class="risk ${riskClass(t.fraud_score)}">${Number(t.fraud_score).toFixed(2)}</span></td>
      <td>${decisionBadge(t.human_decision)}</td>
    </tr>`).join("");
  tbody.querySelectorAll("tr").forEach(tr => {
    tr.addEventListener("click", () => selectTx(tr.dataset.id));
  });
}

async function refreshRecent() {
  const r = await fetch(API + "/api/transactions?limit=50");
  const rows = await r.json();
  const tbody = document.querySelector("#recent-table tbody");
  if (!rows.length) {
    tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; color: var(--muted); padding: 32px;">No ACH payments yet - trigger fraud_stream to simulate.</td></tr>';
    return;
  }
  tbody.innerHTML = rows.map(t => `
    <tr>
      <td>${fmtTime(t.ts)}</td>
      <td>${fmtAmt(t.amount)}</td>
      <td>${t.receiver_name}</td>
      <td>${t.originator_state} -> ${t.receiver_state}</td>
      <td>${t.channel}</td>
      <td><span class="risk ${riskClass(t.fraud_score)}">${Number(t.fraud_score).toFixed(2)}</span></td>
      <td>${decisionBadge(t.human_decision, t.fraud_score)}</td>
    </tr>`).join("");
}

async function selectTx(id) {
  selectedId = id;
  document.querySelectorAll("#flagged-table tbody tr").forEach(tr => {
    tr.classList.toggle("selected", tr.dataset.id === id);
  });
  const r = await fetch(API + "/api/transaction/" + encodeURIComponent(id));
  if (!r.ok) return;
  const t = await r.json();
  const reasons = (t.reasons && t.reasons.length)
    ? `<ul>${t.reasons.map(x => `<li>${x}</li>`).join("")}</ul>`
    : '<div class="none">No specific reasons stored.</div>';
  const existingNotes = (t.human_notes || "").replace(/'/g, "&apos;");
  const decisionHtml = t.human_decision
    ? `<div style="margin-top:8px;">Current decision: ${decisionBadge(t.human_decision)}</div>`
    : "";
  document.querySelector("#details .body").innerHTML = `
    <div class="detail-row"><span class="k">Payment ID</span><span class="v" style="font-family:monospace; font-size:11px;">${t.id}</span></div>
    <div class="detail-row"><span class="k">Timestamp</span><span class="v">${fmtTime(t.ts)}</span></div>
    <div class="detail-row"><span class="k">Originator / Receiver</span><span class="v">${t.originator_id} / ${t.receiver_id}</span></div>
    <div class="detail-row"><span class="k">Amount</span><span class="v">${fmtAmt(t.amount)}</span></div>
    <div class="detail-row"><span class="k">Originator / Receiver names</span><span class="v">${t.originator_name} -> ${t.receiver_name}</span></div>
    <div class="detail-row"><span class="k">States</span><span class="v">${t.originator_state} -> ${t.receiver_state}</span></div>
    <div class="detail-row"><span class="k">Payment type / SEC code</span><span class="v">${t.payment_type} / ${t.sec_code}</span></div>
    <div class="detail-row"><span class="k">Account age</span><span class="v">${t.account_age_days} days</span></div>
    <div class="detail-row"><span class="k">Channel</span><span class="v">${t.channel}</span></div>
    <div class="detail-row"><span class="k">Fraud risk score</span><span class="v"><span class="risk ${riskClass(t.fraud_score)}">${Number(t.fraud_score).toFixed(3)}</span></span></div>
    <div class="reasons">
      <h3>Why was this payment flagged?</h3>
      ${reasons}
    </div>
    <div class="actions">
      <h3>Human decision</h3>
      <button class="btn legit" onclick="submitDecision('${t.id}', 'Legitimate')">Mark Legitimate</button>
      <button class="btn fraud" onclick="submitDecision('${t.id}', 'Fraud')">Mark Fraud</button>
      <button class="btn invest" onclick="submitDecision('${t.id}', 'Needs further investigation')">Needs Investigation</button>
      ${decisionHtml}
      <div class="notes-box">
        <label for="review-notes">Review notes</label>
        <textarea id="review-notes" placeholder="Add any comments or context for this review...">${existingNotes}</textarea>
      </div>
    </div>
  `;
}

async function submitDecision(id, decision) {
  const notesEl = document.getElementById("review-notes");
  const notes = notesEl ? notesEl.value.trim() : "";
  const r = await fetch(API + "/api/decision/" + encodeURIComponent(id), {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ decision, notes }),
  });
  if (r.ok) {
    showToast(`Recorded decision: ${decision}`);
    await Promise.all([refreshKpis(), refreshFlagged(), refreshRecent(), selectTx(id)]);
  } else {
    showToast("Failed to record decision", true);
  }
}

async function refreshAll() {
  try {
    await Promise.all([refreshKpis(), refreshFlagged(), refreshRecent()]);
    document.getElementById("last-update").textContent =
      "Last update: " + new Date().toLocaleTimeString();
  } catch (e) {
    console.error(e);
  }
}

document.querySelectorAll("#flagged-table th.sortable").forEach(th => {
  th.addEventListener("click", () => {
    const dataSort = th.dataset.sort; // e.g., "time_desc"
    const columnName = dataSort.replace(/_asc$|_desc$/, ""); // e.g., "time"
    const currentBase = flaggedSort.replace(/_asc$|_desc$/, "");
    
    if (columnName === currentBase) {
      // Same column - toggle direction
      flaggedSort = flaggedSort.endsWith("_asc") ? columnName + "_desc" : columnName + "_asc";
    } else {
      // New column - start with default (usually desc)
      flaggedSort = dataSort;
    }
    updateSortIcons();
    refreshFlagged();
  });
});

function updateSortIcons() {
  document.querySelectorAll("#flagged-table th.sortable").forEach(th => {
    const columnName = th.dataset.sort.replace(/_asc$|_desc$/, "");
    const currentBase = flaggedSort.replace(/_asc$|_desc$/, "");
    const isActive = columnName === currentBase;
    th.classList.toggle("active", isActive);
    const icon = th.querySelector(".sort-icon");
    if (isActive) {
      icon.textContent = flaggedSort.endsWith("_asc") ? "▲" : "▼";
    } else {
      icon.textContent = "◆";
    }
  });
}
updateSortIcons();

refreshAll();
setInterval(refreshAll, 5000);
</script>
</body>
</html>
